# 로컬에 API 프로세스가 여러 개일 때 통합 테스트가 기본 풀 10개로 연결을 소진하지 않게 한다.
spring:
  datasource:
    hikari:
      maximum-pool-size: 2
      minimum-idle: 0

# 단위 테스트: R2 플레이스홀더(실 연결 없음). r2S3Client는 엔드포인트 등 비어 있으면 미등록.
app:
  r2:
    endpoint: https://00000000000000000000000000000000.r2.cloudflarestorage.com
    access-key: test-r2-access
    secret-key: test-r2-secret
    bucket: test-placeholder-r2-bucket
    public-url: https://pub-test-placeholder.r2.dev
    region: auto
  s3:
    client-enabled: false
    bucket: test-placeholder-bucket
    region: ap-northeast-2
  translation:
    allowed-hosts: api.openai.com,translate.googleapis.com,oauth2.googleapis.com
