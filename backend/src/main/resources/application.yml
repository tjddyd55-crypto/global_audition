audition:
  # 기동 시 투표/랭킹 관련 DB 스키마 점검 (PostgreSQL). 비활성: voting-db-verify: false
  voting-db-verify: true

app:
  version: 1.0.0-SNAPSHOT
  buildId: ""
  public-base-url: "http://localhost:8080"
  # Railway 등: BOOTSTRAP_SUPER_ADMIN=true 로 한 번 기동해 계정 생성 후 반드시 false 로 복구
  super-admin:
    bootstrap-enabled: ${BOOTSTRAP_SUPER_ADMIN:false}
  # 쉼표 구분. Railway: APP_CORS_ALLOWED_ORIGINS=https://...,http://localhost:3000
  cors:
    allowed-origins: "${APP_CORS_ALLOWED_ORIGINS:http://localhost:3000,https://frontend-production-8613a.up.railway.app}"
  # 이미지 업로드(S3). Railway 등: AWS_BUCKET·AWS_REGION·자격증명 필수. bucket 비우면 업로드 API 503.
  # 퍼블릭 읽기는 버킷 정책(또는 CloudFront) — Object ACL 미사용.
  s3:
    bucket: ${AWS_BUCKET}
    region: ${AWS_REGION}
    public-base-url: ${AWS_S3_PUBLIC_BASE_URL:}
    endpoint: ${AWS_S3_ENDPOINT:}
    public-read-acl: false
  jwt:
    secret: "${JWT_SECRET:change-me-in-production-min-32-chars}"
    expiration-ms: 86400000  # 24h
  # 운영: false 권장 — 크레딧 충전은 payment_orders(PAID) 경로만 사용
  credits:
    allow-legacy-self-charge: ${APP_ALLOW_LEGACY_CREDIT_CHARGE:true}

spring:
  application:
    name: audition-platform-backend

  servlet:
    multipart:
      max-file-size: 50MB
      max-request-size: 55MB

  datasource:
    url: jdbc:postgresql://localhost:5432/audition?currentSchema=public
    username: postgres
    password: postgres
    driver-class-name: org.postgresql.Driver
    hikari:
      schema: public
      connection-init-sql: SET search_path TO public

  jpa:
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        hbm2ddl:
          auto: none
    show-sql: false
    open-in-view: false

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    baseline-version: 0
    schemas: public
    default-schema: public
    create-schemas: true
    init-sqls: SET search_path TO public
    repair-on-migrate: true

server:
  port: 8080
