audition:
  # 기동 시 투표/랭킹 관련 DB 스키마 점검 (PostgreSQL). 비활성: voting-db-verify: false
  voting-db-verify: true

app:
  version: 1.0.0-SNAPSHOT
  buildId: ""
  public-base-url: "http://localhost:8080"
  # Railway 등: BOOTSTRAP_SUPER_ADMIN=true 로 한 번 기동해 계정 생성 후 반드시 false 로 복구
  super-admin:
    bootstrap-enabled: ${BOOTSTRAP_SUPER_ADMIN:false}
  # 쉼표 구분(선택). 커스텀 도메인만 나열. 기본은 localhost 패턴만(프론트는 Next 동일 Origin 프록시).
  # 예: APP_CORS_ALLOWED_ORIGINS=https://my-domain.com
  cors:
    allowed-origins: "${APP_CORS_ALLOWED_ORIGINS:}"
  # 이미지: Cloudflare R2(S3 호환). R2_ENDPOINT·R2_BUCKET·키·R2_PUBLIC_URL·AWS_REGION(서명용, auto 권장).
  # 업로드는 브라우저→백엔드 API→R2 만 허용 — 브라우저가 R2에 직접 PUT하지 않으므로 R2 버킷 CORS는 불필요(미설정 권장).
  r2:
    endpoint: ${R2_ENDPOINT:}
    access-key: ${R2_ACCESS_KEY:${AWS_ACCESS_KEY_ID:}}
    secret-key: ${R2_SECRET_KEY:${AWS_SECRET_ACCESS_KEY:}}
    bucket: ${R2_BUCKET:}
    public-url: ${R2_PUBLIC_URL:}
    region: ${AWS_REGION:auto}
  # 향후 영상·대용량 파일 전용 AWS S3. 이미지와 클라이언트 빈을 공유하지 않는다.
  # app.s3.client-enabled=true 일 때만 awsS3Client 등록 — 키는 기존 AWS_* 유지.
  s3:
    client-enabled: ${APP_S3_CLIENT_ENABLED:false}
    bucket: ${AWS_BUCKET:}
    region: ${AWS_REGION:}
    public-read-acl: false
    public-base-url: ${AWS_S3_PUBLIC_BASE_URL:}
    endpoint: ${AWS_S3_ENDPOINT:}
  jwt:
    secret: "${JWT_SECRET:change-me-in-production-min-32-chars}"
    expiration-ms: 86400000  # 24h
  # 이미지 업로드: 프론트 선검증·multipart·R2 업로드 모두 동일 상한 권장 (기본 10MB)
  upload:
    max-image-bytes: 10485760
    thumb-max-edge-px: 300
    medium-max-edge-px: 800
    # 시간당·일당 0 이하이면 해당 창 제한 비활성화
    rate-limit-per-user-per-hour: ${APP_UPLOAD_RATE_PER_HOUR:120}
    rate-limit-per-user-per-day: ${APP_UPLOAD_RATE_PER_DAY:800}
  # 운영: false 권장 — 크레딧 충전은 payment_orders(PAID) 경로만 사용
  credits:
    allow-legacy-self-charge: ${APP_ALLOW_LEGACY_CREDIT_CHARGE:true}

spring:
  application:
    name: audition-platform-backend

  servlet:
    multipart:
      enabled: true
      max-file-size: 10MB
      max-request-size: 10MB

  # 로컬: 기본 localhost. Railway: SPRING_DATASOURCE_* 또는 PG* 환경변수로 덮어씀 (프로파일 불필요).
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://${PGHOST:localhost}:${PGPORT:5432}/${PGDATABASE:audition}?currentSchema=public}
    username: ${SPRING_DATASOURCE_USERNAME:${PGUSER:postgres}}
    password: ${SPRING_DATASOURCE_PASSWORD:${PGPASSWORD:postgres}}
    driver-class-name: org.postgresql.Driver
    hikari:
      schema: public
      connection-init-sql: SET search_path TO public

  jpa:
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        hbm2ddl:
          auto: none
    show-sql: false
    open-in-view: false

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    baseline-version: 0
    schemas: public
    default-schema: public
    create-schemas: true
    init-sqls: SET search_path TO public
    repair-on-migrate: true

server:
  port: 8080
