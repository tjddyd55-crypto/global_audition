name: backend-tests

on:
  pull_request:
    paths: ["backend/**", ".github/workflows/backend-tests.yml"]
  push:
    branches: ["security/**", "integration/**", "develop"]
    paths: ["backend/**", ".github/workflows/backend-tests.yml"]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: audition_ci
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      # CI 전용 서비스 컨테이너. 운영 DB 주소는 TestDatabase 가 거부한다.
      TEST_DB_URL: jdbc:postgresql://localhost:5432/audition_ci
      TEST_DB_USER: postgres
      TEST_DB_PASSWORD: postgres
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
        with:
          # JWT 테스트가 git show 3aaf471 로 퇴역 기본값을 읽으므로 전체 이력이 필요하다.
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven
      - name: mvn verify (surefire unit + failsafe IT)
        run: |
          # 실행마다 새 테스트 전용 JWT 키. 출력하지 않는다.
          JWT_SECRET="$(openssl rand -base64 64 | tr -d '\n=')"
          export JWT_SECRET
          bash ./mvnw -B verify
      - name: Test counts
        if: always()
        run: |
          python3 - <<'PY' | tee -a "$GITHUB_STEP_SUMMARY"
          import glob, re
          for label, d in (("Unit (surefire)", "target/surefire-reports"), ("Integration (failsafe)", "target/failsafe-reports")):
              t = f = e = s = 0
              for p in glob.glob(d + "/TEST-*.xml"):
                  head = open(p, encoding="utf-8").read(800)
                  g = lambda k: int(re.search(k + r'="(\d+)"', head).group(1))
                  t += g("tests"); f += g("failures"); e += g("errors"); s += g("skipped")
              print(f"- {label}: run={t} failures={f} errors={e} skipped={s}")
          PY
